# Deploy to GitHub Pages.
#
# The only thing this does beyond a plain static upload is write the sound
# pack's passphrase into assets/sfx-eft/key.json out of the SFX_PACK_KEY
# repository secret. That file is gitignored and exists only inside the
# published artifact, so the key stays out of the tree while the site can
# still unseal assets/sfx-eft/pack.bin in the background at boot.
#
# Needs, once, in the repository settings:
#   Settings > Secrets and variables > Actions > New repository secret,
#     named SFX_PACK_KEY, holding the passphrase tools/pack_sfx.py printed
#   Settings > Pages > Source: GitHub Actions
#
# With no secret set the step is skipped and the site falls back to the CC0
# pack in assets/sfx, exactly as it did before the pack existed.

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# let a running deploy finish; queue at most one behind it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Unlock the sound pack
        env:
          SFX_PACK_KEY: ${{ secrets.SFX_PACK_KEY }}
        run: |
          if [ -z "$SFX_PACK_KEY" ]; then
            echo "SFX_PACK_KEY is not set - the build will use the CC0 pack."
            exit 0
          fi
          if [ ! -f assets/sfx-eft/pack.bin ]; then
            echo "assets/sfx-eft/pack.bin is missing - the build will use the CC0 pack."
            exit 0
          fi
          jq -n --arg key "$SFX_PACK_KEY" '{key: $key}' > assets/sfx-eft/key.json
          echo "Wrote assets/sfx-eft/key.json ($(stat -c%s assets/sfx-eft/pack.bin) byte pack)."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
