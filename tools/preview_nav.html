<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>nav</title>
<style>html,body{margin:0;background:#000;color:#f4f4f9;font:12px/1.4 Cascadia Mono,monospace}
canvas{display:block}#hud{position:fixed;left:8px;top:8px;background:#0e1519e8;border:1px solid #344b56;padding:8px 10px;white-space:pre;max-height:96vh;overflow:auto}</style>
</head><body>
<canvas id="c" width="1400" height="1500"></canvas>
<div id="hud">…</div>
<script type="module">
import { NavGrid, loadGeometry, CELL } from '../src/raid/nav.js';
import { MAPS } from '../src/data/maps.js';

const geo = await loadGeometry(MAPS.factory.geometry);
const m = MAPS.factory;
// ?level=basement|ground|second|third — the plant is four storeys now
const level = new URLSearchParams(location.search).get('level') || m.startLevel;
const doors = (geo.levels[level].passages || [])
  .filter((p) => p.key || p.w <= m.doorMaxWidth)
  .map((p) => ({ ...p, state: p.key ? 'key' : 'free', open: false }));
const nav = new NavGrid(geo, level, doors);

// connected components over the walkable mask
const comp = new Int32Array(nav.walk.length).fill(-1);
const sizes = [];
for (let i = 0; i < nav.walk.length; i++) {
  if (!nav.walk[i] || comp[i] !== -1) continue;
  const id = sizes.length;
  let n = 0;
  const stack = [i];
  comp[i] = id;
  while (stack.length) {
    const cur = stack.pop(); n++;
    const cx = cur % nav.w, cy = (cur / nav.w) | 0;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= nav.w || ny >= nav.h) continue;
      const ni = ny * nav.w + nx;
      if (nav.walk[ni] && comp[ni] === -1) { comp[ni] = id; stack.push(ni); }
    }
  }
  sizes.push(n);
}
const order = sizes.map((n, i) => [n, i]).sort((a, b) => b[0] - a[0]);

const cv = document.getElementById('c'), g = cv.getContext('2d');
const [, , vw, vh] = geo.viewBox;
const s = Math.min(cv.width / vw, cv.height / vh);
g.fillStyle = '#05090b'; g.fillRect(0, 0, cv.width, cv.height);

const COLORS = ['#2f4550','#7fb39a','#d9a441','#c2604f','#7f9fc2','#b8dbd9','#8f6fb0','#6fb0a4','#b07f6f','#6f8fb0'];
const rank = new Map(order.map(([, id], r) => [id, r]));
const px = CELL * s;
for (let cy = 0; cy < nav.h; cy++) {
  for (let cx = 0; cx < nav.w; cx++) {
    const i = cy * nav.w + cx;
    if (!nav.walk[i]) continue;
    const r = rank.get(comp[i]) ?? 9;
    g.fillStyle = COLORS[Math.min(r, COLORS.length - 1)];
    g.fillRect(cx * px, cy * px, px + 0.6, px + 0.6);
  }
}
// walls on top
g.strokeStyle = 'rgba(244,244,249,.35)'; g.lineWidth = 1;
for (const line of geo.levels[level].walls) {
  g.beginPath(); line.forEach((p, i) => (i ? g.lineTo(p[0]*s, p[1]*s) : g.moveTo(p[0]*s, p[1]*s))); g.stroke();
}

const lines = [`components: ${sizes.length}`, `top sizes: ${order.slice(0,8).map(([n,i])=>`#${rank.get(i)}=${n}`).join(' ')}`, ''];
function mark(x, y, label, color) {
  const sx = x * s, sy = y * s;
  g.strokeStyle = color; g.lineWidth = 2;
  g.beginPath(); g.arc(sx, sy, 8, 0, Math.PI*2); g.stroke();
  g.fillStyle = color; g.font = '11px monospace'; g.fillText(label, sx + 11, sy + 4);
  const sn = nav.snap(x, y);
  const c = sn ? comp[nav.idx(...nav.toCell(sn[0], sn[1]))] : -1;
  return c === -1 ? '?' : rank.get(c);
}
lines.unshift(`level: ${level}`);
lines.push('EXTRACTS');
for (const e of geo.markers.extracts.filter((e) => e.level === level)) {
  lines.push(`  ${e.name.padEnd(20)} comp #${mark(e.x, e.y, e.name, '#f4f4f9')}`);
}
lines.push('SPAWNS');
geo.markers.spawns.filter((sp) => sp.level === level)
  .forEach((sp, i) => lines.push(`  spawn${i} comp #${mark(sp.x, sp.y, 's'+i, '#b8dbd9')}`));
lines.push('DOORS');
for (const d of doors) {
  const col = d.key ? '#c2604f' : '#c98f4a';
  lines.push(`  ${d.id.padEnd(10)} w=${d.w.toFixed(2)} ${d.key ? 'KEY ' + d.key : ''}`);
  const nx = Math.cos(d.a) * (d.w / 2 + 0.22), ny = Math.sin(d.a) * (d.w / 2 + 0.22);
  g.strokeStyle = col; g.lineWidth = 3;
  g.beginPath(); g.moveTo((d.x-nx)*s, (d.y-ny)*s); g.lineTo((d.x+nx)*s, (d.y+ny)*s); g.stroke();
}
lines.push('STAIRWELLS');
for (const st of geo.stairwells.filter((st) => st.levels.includes(level))) {
  g.strokeStyle = '#d9a441'; g.lineWidth = 1.5;
  g.strokeRect(st.rect[0]*s, st.rect[1]*s, (st.rect[2]-st.rect[0])*s, (st.rect[3]-st.rect[1])*s);
  lines.push(`  ${st.id.padEnd(12)} ${st.levels.join('-')}`);
}
lines.push('AREAS');
for (const r of m.areas.filter((a) => a.level === level)) {
  const [x0,y0,x1,y1] = r.rect;
  g.strokeStyle = 'rgba(184,219,217,.25)'; g.setLineDash([4,4]); g.lineWidth = 1;
  g.strokeRect(x0*s, y0*s, (x1-x0)*s, (y1-y0)*s); g.setLineDash([]);
  let ok = 0;
  for (let t = 0; t < 200; t++) {
    const x = x0 + Math.random()*(x1-x0), y = y0 + Math.random()*(y1-y0);
    if (nav.walkable(x, y)) ok++;
  }
  lines.push(`  ${r.name.padEnd(24)} walkable ${Math.round(ok/2)}%`);
}
document.getElementById('hud').textContent = lines.join('\n');
document.title = 'ready';
</script></body></html>
