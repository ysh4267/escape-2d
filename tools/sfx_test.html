<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>audio</title>
<style>
 body{margin:0;background:#05090b;color:#f4f4f9;font:13px/1.6 Cascadia Mono,Consolas,monospace;padding:18px}
 #sum{display:inline-block;padding:8px 12px;border:1px solid #344b56;margin-bottom:14px}
 .ok{color:#7fb39a}.bad{color:#c2604f}.warn{color:#d9a441}
 .hd{color:#b8dbd9;margin:16px 0 6px;letter-spacing:.15em}
</style></head><body>
<div id="sum">checking…</div>
<div id="out"></div>
<script type="module">
const out = document.getElementById('out');
const line = (t, cls) => { const d = document.createElement('div'); d.textContent = t; if (cls) d.className = cls; out.append(d); return d; };
const head = (t) => line('== ' + t + ' ==', 'hd');
let ok = 0, bad = 0;
const check = (name, cond, extra = '') => {
  if (cond) { ok++; line('  PASS  ' + name, 'ok'); }
  else { bad++; line('  FAIL  ' + name + (extra ? '  -> ' + extra : ''), 'bad'); }
};

// ---------------------------------------------------------
head('shipped effects');
const manifest = await (await fetch('../assets/sfx/manifest.json')).json();
check('manifest lists only footsteps',
  manifest.length === 6 && manifest.every((n) => /^step_\d$/.test(n)),
  manifest.join(','));

for (const name of manifest) {
  const res = await fetch(`../assets/sfx/${name}.ogg`);
  let good = false, detail = '';
  if (res.ok) {
    const ab = await res.arrayBuffer();
    const h = new Uint8Array(ab, 0, 4);
    good = h[0] === 0x4f && h[1] === 0x67 && h[2] === 0x67 && h[3] === 0x53 && ab.byteLength > 800;
    detail = (ab.byteLength / 1024).toFixed(1) + ' KiB';
  } else {
    detail = 'HTTP ' + res.status;
  }
  check(`${name}.ogg is a valid Ogg (${detail})`, good, detail);
}

// ---------------------------------------------------------
head('audio surface');
const audio = await import('../src/core/audio.js');
const keys = Object.keys(audio.sfx);
check('sfx exposes footstep only', keys.length === 1 && keys[0] === 'footstep', keys.join(','));
check('ambient controls exist',
  typeof audio.startAmbient === 'function' && typeof audio.stopAmbient === 'function');
check('volume controls exist',
  typeof audio.setEnabled === 'function' && typeof audio.setVolume === 'function');

// no source file may still call a removed cue
const files = ['src/core/audio.js', 'src/raid/raid.js', 'src/raid/ai.js', 'src/ui/raid-ui.js',
  'src/ui/trade.js', 'src/ui/shell.js', 'src/ui/stash.js', 'src/main.js',
  'src/inventory/dnd.js', 'src/inventory/window.js'];
const stale = [];
for (const f of files) {
  const txt = await (await fetch('../' + f)).text();
  for (const m of txt.matchAll(/sfx\.(\w+)\s*\(/g)) {
    if (m[1] !== 'footstep') stale.push(`${f}:${m[1]}`);
  }
}
check('no source calls a removed cue', stale.length === 0, stale.join(', '));

// ---------------------------------------------------------
const sum = document.getElementById('sum');
sum.textContent = `${ok} passed, ${bad} failed`;
sum.style.color = bad ? '#c2604f' : '#7fb39a';
sum.style.borderColor = bad ? '#c2604f' : '#7fb39a';
document.title = bad ? `FAIL ${bad}` : `PASS ${ok}`;
</script></body></html>
