<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>audio</title>
<style>
 body{margin:0;background:#05090b;color:#f4f4f9;font:13px/1.6 Cascadia Mono,Consolas,monospace;padding:18px}
 #sum{display:inline-block;padding:8px 12px;border:1px solid #344b56;margin-bottom:14px}
 .ok{color:#7fb39a}.bad{color:#c2604f}.warn{color:#d9a441}.dim{color:#7c8a92}
 .hd{color:#b8dbd9;margin:16px 0 6px;letter-spacing:.15em}
</style></head><body>
<div id="sum">checking…</div>
<div id="out"></div>
<script type="module">
const out = document.getElementById('out');
const line = (t, cls) => { const d = document.createElement('div'); d.textContent = t; if (cls) d.className = cls; out.append(d); return d; };
const head = (t) => line('== ' + t + ' ==', 'hd');
let ok = 0, bad = 0;
const check = (name, cond, extra = '') => {
  if (cond) { ok++; line('  PASS  ' + name, 'ok'); }
  else { bad++; line('  FAIL  ' + name + (extra ? '  -> ' + extra : ''), 'bad'); }
};
const note = (t) => line('  ..    ' + t, 'dim');

// ---------------------------------------------------------
// Which source is deployed? Same order as src/core/audio.js: the loose
// extracted clips, then the sealed container. The repository ships the sealed
// one, so a clean checkout still gets the full coverage checks below.
head('sound pack');
let pack = null, manifest = null, source = null;
/** base name -> Uint8Array, only when the sealed container is what answered */
let blobs = null;

/** mirror of tools/pack_sfx.py: magic | salt(16) | iv(12) | ciphertext+tag */
const { SEALED_KEY } = await import('../src/core/audio.js');
async function unseal() {
  if (!window.crypto?.subtle || typeof DecompressionStream !== 'function') return false;
  const packRes = await fetch('../assets/sfx-eft/pack.bin');
  if (!packRes.ok) return false;
  const bytes = new Uint8Array(await packRes.arrayBuffer());
  if (new TextDecoder().decode(bytes.subarray(0, 6)) !== 'E2SFX1') return false;

  const material = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(SEALED_KEY), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: bytes.subarray(6, 22), iterations: 200000, hash: 'SHA-256' },
    material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: bytes.subarray(22, 34) }, key, bytes.subarray(34));

  const raw = new Uint8Array(await new Response(new Blob([plain]).stream()
    .pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  const headLen = new DataView(raw.buffer, raw.byteOffset, 4).getUint32(0, true);
  const header = JSON.parse(new TextDecoder().decode(raw.subarray(4, 4 + headLen)));
  const body = raw.subarray(4 + headLen);

  blobs = new Map(header.files.map((f) => [f.name, body.subarray(f.off, f.off + f.len)]));
  manifest = header.manifest;
  return true;
}

async function tryLoose() {
  try {
    const res = await fetch('../assets/sfx-eft/manifest.json');
    if (!res.ok) return false;
    manifest = await res.json();
    pack = '../assets/sfx-eft/';
    source = 'loose clips from a local EFT install';
    return true;
  } catch { return false; }
}
async function trySealed() {
  try {
    if (!await unseal()) return false;
  } catch (e) {
    note('pack.bin is there but would not unseal: ' + e);
    return false;
  }
  pack = '../assets/sfx-eft/';
  source = 'sealed pack.bin, unsealed in the page';
  return true;
}

await tryLoose() || await trySealed();
check('a sound pack is present', !!pack, 'none found');
note(`pack: ${pack}  (${source})`);

{
  check('cue manifest is an object of arrays',
    !!manifest && Object.values(manifest).every((v) => Array.isArray(v) && v.length));
}

// ---------------------------------------------------------
head('files');
const files = [...new Set(Object.values(manifest).flat())];
note(`${Object.keys(manifest).length} cues over ${files.length} files`);
const isOgg = (b) => b.length > 500 && b[0] === 0x4f && b[1] === 0x67 && b[2] === 0x67 && b[3] === 0x53;
let badFiles = [];
for (const name of files) {
  let bytes = null;
  if (blobs) {
    bytes = blobs.get(name);
  } else {
    const res = await fetch(`${pack}${name}.ogg`);
    if (res.ok) bytes = new Uint8Array(await res.arrayBuffer());
  }
  if (!bytes || !isOgg(bytes)) badFiles.push(name);
}
check('every manifest file is a valid Ogg', badFiles.length === 0, badFiles.slice(0, 8).join(','));

if (blobs) {
  // the container is only useful if what comes out of it actually decodes
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  let decoded = 0, failed = [];
  for (const name of files.slice(0, 8)) {
    try { await ctx.decodeAudioData(blobs.get(name).slice().buffer); decoded++; }
    catch { failed.push(name); }
  }
  check('unsealed clips decode as audio', failed.length === 0, failed.join(','));
  note(`${decoded} of 8 sampled clips decoded`);
  ctx.close();
}

// ---------------------------------------------------------
head('audio surface');
const audio = await import('../src/core/audio.js');
for (const fn of ['play', 'hasCue', 'setEnabled', 'setVolume', 'audioState', 'startAmbient', 'stopAmbient']) {
  check(`exports ${fn}`, typeof audio[fn] === 'function');
}
for (const m of ['footstep', 'halt', 'ui', 'trade', 'item', 'searchStart', 'searchStop',
  'openContainer', 'use', 'fire', 'hostileFire', 'hit', 'impact', 'death', 'extract']) {
  check(`sfx.${m} exists`, typeof audio.sfx[m] === 'function');
}
// a cue with no audio behind it must be a quiet no-op, never a throw
let threw = null;
try {
  audio.play('definitely_not_a_cue');
  audio.sfx.item('nonexistent_category', 'pickup');
  audio.sfx.searchStart('nonexistent_container');
  audio.sfx.searchStop();
  audio.sfx.fire(null);
  audio.sfx.hostileFire(null);
  audio.sfx.ui('nope');
} catch (e) { threw = e; }
check('unknown cues are silent no-ops', !threw, threw && String(threw));

// the combat surface is driven by values off templates and the AI, not by
// literals, so exercise it the way the game does: a corpse opens silently, a
// weapon with no entry still finds a bank, and every hit kind is a real cue
let combatThrew = null;
try {
  audio.sfx.openContainer('deadscav');       // no lid, must not throw
  audio.sfx.openContainer('crate');
  audio.sfx.fire({ id: 'not-a-real-id', cat: 'weapon', cal: '7.62x39' });
  audio.sfx.fire({ id: 'not-a-real-id', cat: 'pistol', cal: '9x18' });
  audio.sfx.hostileFire('akm');
  audio.sfx.hostileFire('garbage-bank');
  for (const k of ['body', 'armor', 'helmet']) audio.sfx.hit(k);
  for (const s of ['concrete', 'metal', 'wood', 'ricochet']) audio.sfx.impact(s);
} catch (e) { combatThrew = e; }
check('combat surface runs on real inputs', !combatThrew, combatThrew && String(combatThrew));

// ---------------------------------------------------------
// Every cue name the game asks for must exist in the pack, or it is a typo
// that would silently never play.
head('cue coverage');
const SRC = [
  'src/core/audio.js', 'src/core/state.js', 'src/raid/raid.js', 'src/raid/ai.js',
  'src/ui/raid-ui.js', 'src/ui/trade.js', 'src/ui/shell.js', 'src/ui/stash.js',
  'src/ui/deploy.js', 'src/main.js', 'src/inventory/dnd.js', 'src/inventory/window.js',
  'src/inventory/dialogs.js', 'src/inventory/examine.js',
];
const wanted = new Set();
for (const f of SRC) {
  const txt = await (await fetch('../' + f)).text();
  for (const m of txt.matchAll(/\bplay\(\s*'([a-z0-9_]+)'/g)) wanted.add(m[1]);
  for (const m of txt.matchAll(/sfx\.ui\(\s*'([a-z0-9_]+)'/g)) wanted.add('ui_' + m[1]);
  for (const m of txt.matchAll(/sfx\.trade\(\s*'([a-z0-9_]+)'/g)) wanted.add('trade_' + m[1]);
}
note(`source asks for ${wanted.size} cues by name`);
if (pack) {
  const absent = [...wanted].filter((c) => !manifest[c]);
  check('every cue named in source exists in the pack', absent.length === 0, absent.join(','));

  // and the reverse: cues shipped but never asked for are dead weight.
  // These families are chosen at the call site rather than named in a literal
  // play('...') - by container material, weapon bank, item ItemSound, or what
  // the round landed on - so the scan above cannot see them.
  const dynamic = /^(item_|search_|open_|fire_|step_|amb_|hit_|impact_|ricochet)/;
  const unused = Object.keys(manifest).filter((c) => !dynamic.test(c) && !wanted.has(c));
  check('no shipped cue is dead weight', unused.length === 0, unused.join(','));

  // the categories the user specifically asked to hear
  for (const cue of ['search_wood', 'search_body',
    'open_case', 'item_med_medkit_pickup', 'item_weap_ar_drop', 'amb_factory',
    'hit_body', 'hit_armor', 'hit_helmet',
    'impact_metal', 'impact_wood', 'impact_concrete', 'ricochet']) {
    check(`cue present: ${cue}`, !!manifest[cue]);
  }

  // item foley is keyed off each template's own ItemSound value, carried
  // through as `snd`, so every value the item database uses needs a cue
  const db = await (await fetch('../src/data/items-db.json')).json();
  const tpls = Array.isArray(db) ? db : Object.values(db.items || db);
  const sounds = [...new Set(tpls.map((t) => t.snd).filter(Boolean))];
  note(`${sounds.length} ItemSound families across ${tpls.length} templates`);
  check('every template carries an ItemSound family', tpls.every((t) => t.snd),
    tpls.filter((t) => !t.snd).map((t) => t.key).slice(0, 6).join(','));
  for (const action of ['pickup', 'drop']) {
    const gaps = sounds.filter((s) => !manifest[`item_${s}_${action}`]);
    check(`every family has a ${action} cue`, gaps.length === 0, gaps.join(','));
  }

  // every rummage loop in itemsounds.bundle is mapped to some container type,
  // and every type the game can place resolves to one that exists
  const RUMMAGE = ['search_wood', 'search_industrial', 'search_metal', 'search_drawer',
    'search_safe', 'search_bag', 'search_techno', 'search_cash', 'search_jacket', 'search_body'];
  const missingLoop = RUMMAGE.filter((c) => !manifest[c]);
  check('every rummage loop is in the pack', missingLoop.length === 0, missingLoop.join(','));

  const audioSrc = await (await fetch('../src/core/audio.js')).text();
  const cueBlock = audioSrc.match(/const SEARCH_CUE = \{([\s\S]*?)\n\};/);
  const mapped = new Set([...(cueBlock ? cueBlock[1] : '').matchAll(/'(search_[a-z]+)'/g)].map((m) => m[1]));
  const unmapped = RUMMAGE.filter((c) => !mapped.has(c));
  check('every rummage loop is mapped to a container', unmapped.length === 0, unmapped.join(','));

  const lootSrc = await (await fetch('../src/data/loot.js')).text();
  const types = [...lootSrc.matchAll(/^\s{2}([a-z0-9_]+):\s*\{\s*name:/gm)].map((m) => m[1]);
  const unresolved = types.filter((t) => {
    const hit = (cueBlock ? cueBlock[1] : '').match(new RegExp(`\\b${t}:\\s*'(search_[a-z]+)'`));
    return !hit || !manifest[hit[1]];
  });
  check('every container type resolves to a real loop', unresolved.length === 0, unresolved.join(','));

  // lids: every container that opens must name a cue the pack actually has.
  // Bodies are deliberately absent from OPEN_CUE - a corpse has no lid - so
  // this checks the entries that exist rather than demanding one per type.
  const openBlock = audioSrc.match(/const OPEN_CUE = \{([\s\S]*?)\n\};/);
  const openPairs = [...(openBlock ? openBlock[1] : '').matchAll(/(\w+):\s*'(open_[a-z]+)'/g)];
  const badLid = openPairs.filter(([, , cue]) => !manifest[cue]).map(([, t]) => t);
  check('every container lid resolves to a real cue', badLid.length === 0, badLid.join(','));
  const lidded = new Set(openPairs.map((m) => m[1]));
  const noLid = types.filter((t) => !lidded.has(t));
  check('only corpses open silently', noLid.every((t) => /body|deadscav/.test(t)), noLid.join(','));

  // footsteps: surface and gait are independent axes, so the pack needs the
  // full matrix. A hole here is what made sprinting swap the floor material.
  const surfBlock = audioSrc.match(/const SURFACES = new Set\(\[([\s\S]*?)\]\)/);
  const surfaces = [...(surfBlock ? surfBlock[1] : '').matchAll(/'(\w+)'/g)].map((m) => m[1]);
  note(`${surfaces.length} footstep surfaces`);
  const stepGaps = [];
  for (const s of surfaces) {
    for (const g of ['walk', 'run', 'sprint', 'stop']) {
      if (!manifest[`step_${s}_${g}`]) stepGaps.push(`step_${s}_${g}`);
    }
  }
  check('every surface has all four gaits', stepGaps.length === 0, stepGaps.join(','));

  // and every surface the map names must be one the pack actually carries,
  // or that region silently falls back to concrete
  const mapSrc = await (await fetch('../src/data/maps.js')).text();
  const used = [...new Set([...mapSrc.matchAll(/surface: '(\w+)'/g)].map((m) => m[1]))];
  note(`map names ${used.length} surfaces: ${used.join(', ')}`);
  const unknown = used.filter((s) => !surfaces.includes(s));
  check('every map surface exists in the pack', unknown.length === 0, unknown.join(','));

  // weapons: each bank needs a player cue and a hostile one, and every weapon
  // template must land on a bank that exists
  const bankBlock = audioSrc.match(/const BANKS = new Set\(\[([\s\S]*?)\]\)/);
  const banks = [...(bankBlock ? bankBlock[1] : '').matchAll(/'([a-z0-9]+)'/g)].map((m) => m[1]);
  note(`${banks.length} weapon banks`);
  const bankGaps = banks.filter((b) => !manifest[`fire_${b}`] || !manifest[`fire_${b}_far`]);
  check('every weapon bank has a near and far cue', bankGaps.length === 0, bankGaps.join(','));
  const guns = tpls.filter((t) => t.cat === 'weapon' || t.cat === 'pistol');
  const wcue = audioSrc.match(/const WEAPON_CUE = \{([\s\S]*?)\n\};/);
  const byId = new Map([...(wcue ? wcue[1] : '').matchAll(/'([0-9a-f]{24})':\s*'(\w+)'/g)]
    .map((m) => [m[1], m[2]]));
  const unbanked = guns.filter((g) => !byId.has(g.id));
  check(`all ${guns.length} weapons have their own bank`, unbanked.length === 0,
    unbanked.map((g) => g.name).join(','));
  const badBank = [...byId.values()].filter((b) => !banks.includes(b));
  check('no weapon points at a bank that does not exist', badBank.length === 0, badBank.join(','));
} else {
  note('no pack answered — cue coverage cannot be checked');
}

// ---------------------------------------------------------
const sum = document.getElementById('sum');
sum.textContent = `${ok} passed, ${bad} failed`;
sum.style.color = bad ? '#c2604f' : '#7fb39a';
sum.style.borderColor = bad ? '#c2604f' : '#7fb39a';
document.title = bad ? `FAIL ${bad}` : `PASS ${ok}`;
</script></body></html>
